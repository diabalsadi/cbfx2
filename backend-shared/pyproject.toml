[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.9",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==3.2.0",
    "python-jose[cryptography]==3.5.0",
    "pydantic[email]==2.5.0",
    "boto3>=1.34",
    "metaapi-cloud-sdk>=28.0.0",
    "metaapi-cloud-copyfactory-sdk>=12.0.0",
    "stripe>=15.0.0",
]

[tool.setuptools.packages.find]
include = ["backend_shared*"]
