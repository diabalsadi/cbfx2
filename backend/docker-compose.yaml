version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cbfx_postgres
    environment:
      POSTGRES_USER: cbfx_user
      POSTGRES_PASSWORD: cbfx_password
      POSTGRES_DB: cbfx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cbfx_user -d cbfx_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cbfx_backend
    environment:
      DATABASE_URL: postgresql://cbfx_user:cbfx_password@db:5432/cbfx_db
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  adminer:
    image: adminer
    container_name: cbfx_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
